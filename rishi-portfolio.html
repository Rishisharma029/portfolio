/* Suppress Framer Motion key warnings */
const _origErr=console.error;

var{useRef,useEffect,useState,useCallback}=React;

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   FadingVideo â€” rAF-driven crossfade
   â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
const FADE_MS=500,FADE_OUT_LEAD=0.55;
function FadingVideo({src,className,style}){
  const vRef=useRef(null),rafRef=useRef(null),foRef=useRef(false);
  const fadeTo=useCallback((t,d)=>{
    if(rafRef.current)cancelAnimationFrame(rafRef.current);
    const v=vRef.current;if(!v)return;
    const s=parseFloat(v.style.opacity)||0,st=performance.now();
    const step=now=>{const p=Math.min((now-st)/d,1);v.style.opacity=s+(t-s)*p;if(p<1)rafRef.current=requestAnimationFrame(step)};
    rafRef.current=requestAnimationFrame(step);
  },[]);
  useEffect(()=>{
    const v=vRef.current;if(!v)return;
    const onL=()=>{v.style.opacity='0';v.play();fadeTo(1,FADE_MS)};
    const onT=()=>{if(!foRef.current&&v.duration-v.currentTime<=FADE_OUT_LEAD&&v.duration-v.currentTime>0){foRef.current=true;fadeTo(0,FADE_MS)}};
    const onE=()=>{v.style.opacity='0';setTimeout(()=>{v.currentTime=0;v.play();foRef.current=false;fadeTo(1,FADE_MS)},100)};
    v.addEventListener('loadeddata',onL);v.addEventListener('timeupdate',onT);v.addEventListener('ended',onE);
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);v.removeEventListener('loadeddata',onL);v.removeEventListener('timeupdate',onT);v.removeEventListener('ended',onE)};
  },[fadeTo]);
  return <video ref={vRef} src={src} autoPlay muted playsInline preload="auto" className={className} style={{...style,opacity:0}}/>;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   BlurText â€” word-by-word blur-in
   â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function BlurText({text,className,style}){
  const ref=useRef(null);const[go,setGo]=useState(false);
  useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setGo(true);o.disconnect()}},{threshold:0.1});if(ref.current)o.observe(ref.current);return()=>o.disconnect()},[]);
  return(
    <p ref={ref} className={className} style={{display:'flex',flexWrap:'wrap',justifyContent:'center',rowGap:'0.1em',...(style||{})}}>
      {text.split(' ').map((w,i)=>(
        <motion.span key={i} style={{display:'inline-block',marginRight:'0.28em'}}
          initial={{filter:'blur(10px)',opacity:0,y:50}}
          animate={go?{filter:['blur(10px)','blur(5px)','blur(0px)'],opacity:[0,0.5,1],y:[50,-5,0]}:{}}
          transition={{duration:0.7,times:[0,0.5,1],ease:'easeOut',delay:(i*100)/1000}}>
          {w}
        </motion.span>
      ))}
    </p>
  );
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Scroll-triggered animation helpers
   â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
const sv={hidden:{opacity:0,y:40,filter:'blur(6px)'},visible:{opacity:1,y:0,filter:'blur(0px)'}};
function ScrollReveal({children,className,delay=0,style}){
  return(
    <motion.div className={className} style={style}
      initial="hidden" whileInView="visible" viewport={{once:true,amount:0.15}}
      variants={sv} transition={{duration:0.7,delay,ease:'easeOut'}}>
      {children}
    </motion.div>
  );
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Animated Counter (for stats)
   â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function AnimatedCounter({end,suffix='',duration=2000}){
  const[count,setCount]=useState(0);
  const ref=useRef(null);
  const inView=useInView(ref,{once:true,amount:0.5});
  useEffect(()=>{
    if(!inView)return;
    const start=performance.now();
    const step=now=>{
      const p=Math.min((now-start)/duration,1);
      const eased=1-Math.pow(1-p,3);
      setCount(Math.floor(eased*end));
      if(p<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },[inView,end,duration]);
  return <span ref={ref}>{count}{suffix}</span>;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Magnetic Button
   â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function MagneticButton({children,className,href,onClick,target,rel}){
  const ref=useRef(null);
  const[offset,setOffset]=useState({x:0,y:0});
  const handleMove=useCallback(e=>{
    const rect=ref.current.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    setOffset({x:(e.clientX-cx)*0.15,y:(e.clientY-cy)*0.15});
  },[]);
  const handleLeave=useCallback(()=>setOffset({x:0,y:0}),[]);
  const Tag=href?'a':'button';
  const props=href?{href,target,rel}:{onClick};
  return(
    <Tag ref={ref} {...props} className={className} onMouseMove={handleMove} onMouseLeave={handleLeave}
      style={{transform:`translate(${offset.x}px,${offset.y}px)`,transition:'transform 0.25s cubic-bezier(0.23,1,0.32,1)',display:'inline-flex',alignItems:'center'}}>
      {children}
    </Tag>
  );
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

    const ctx=canvas.getContext('2d');
    let w,h,particles=[],raf;
    const resize=()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight};
    resize();window.addEventListener('resize',resize);
    for(let i=0;i<60;i++){
      particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.5});
    }
    const draw=()=>{
      ctx.clearRect(0,0,w,h);
      particles.forEach((p,i)=>{
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fill();
        for(let j=i+1;j<particles.length;j++){
          const dx=p.x-particles[j].x,dy=p.y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);
          if(dist<120){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(255,255,255,${0.15*(1-dist/120)})`;ctx.lineWidth=0.5;ctx.stroke();}
        }
      });
      raf=requestAnimationFrame(draw);
    };
    draw();
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize)};
  },[]);
  return null;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

function CustomCursor(){
  const dotRef=useRef(null),ringRef=useRef(null);
  const mouse=useRef({x:0,y:0}),ring=useRef({x:0,y:0});
  const trails=useRef([]);
  const canvasRef=useRef(null);
  useEffect(()=>{
    if(window.matchMedia('(hover:none)').matches)return;
    const onMove=e=>{mouse.current={x:e.clientX,y:e.clientY}};
    const onOver=e=>{
      const t=e.target.closest('a,button,[data-magnetic]');
      if(t&&ringRef.current){ringRef.current.style.width='56px';ringRef.current.style.height='56px';ringRef.current.style.borderColor='rgba(255,255,255,0.7)'}
    };
    const onOut=e=>{
      if(ringRef.current){ringRef.current.style.width='40px';ringRef.current.style.height='40px';ringRef.current.style.borderColor='rgba(255,255,255,0.4)'}
    };
    window.addEventListener('mousemove',onMove);
    document.addEventListener('mouseover',onOver);
    document.addEventListener('mouseout',onOut);
    const canvas=canvasRef.current;
    const ctx=canvas?canvas.getContext('2d'):null;
    const resizeCanvas=()=>{if(canvas){canvas.width=window.innerWidth;canvas.height=window.innerHeight}};
    resizeCanvas();window.addEventListener('resize',resizeCanvas);
    let raf;
    const loop=()=>{
      const m=mouse.current;
      ring.current.x+=(m.x-ring.current.x)*0.12;
      ring.current.y+=(m.y-ring.current.y)*0.12;
      if(dotRef.current){dotRef.current.style.left=(m.x-4)+'px';dotRef.current.style.top=(m.y-4)+'px'}
      if(ringRef.current){ringRef.current.style.left=(ring.current.x-20)+'px';ringRef.current.style.top=(ring.current.y-20)+'px'}
      trails.current.push({x:m.x,y:m.y,life:1});
      if(trails.current.length>30)trails.current.shift();
      if(ctx&&canvas){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        trails.current.forEach((t,i)=>{
          t.life-=0.04;
          if(t.life>0){ctx.beginPath();ctx.arc(t.x,t.y,t.life*12,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${t.life*0.08})`;ctx.fill()}
        });
        trails.current=trails.current.filter(t=>t.life>0);
      }
      raf=requestAnimationFrame(loop);
    };
    loop();
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('mousemove',onMove);document.removeEventListener('mouseover',onOver);document.removeEventListener('mouseout',onOut);window.removeEventListener('resize',resizeCanvas)};
  },[]);
  if(typeof window!=='undefined'&&window.matchMedia('(hover:none)').matches)return null;
  return(
    <>
      <canvas ref={canvasRef} style={{position:'fixed',inset:0,zIndex:9996,pointerEvents:'none'}}/>
      <div ref={dotRef} className="cursor-dot"/>
      <div ref={ringRef} className="cursor-ring"/>
    </>
  );
}

function LoadingScreen(){
  useEffect(()=>{
    const loader=document.getElementById('loader');
    const authText=document.getElementById('auth-text');
    const accessEl=document.getElementById('access-granted');
    const barFill=document.getElementById('auth-bar-fill');
    if(!loader||!authText)return;

    const AUTH_MSG='Authenticating user...  â–ˆâ–ˆâ–ˆâ–ˆâ–ˆâ–ˆâ–ˆâ–ˆâ–ˆâ–ˆ  100%';
    let i=0,barW=0,rafBar,dismissed=false;

    /* Animate progress bar in parallel */
    const startTime=performance.now();
    const barDuration=1800;
    const animBar=now=>{
      const p=Math.min((now-startTime)/barDuration,1);
      barW=p*100;
      if(barFill)barFill.style.width=barW+'%';
      if(p<1)rafBar=requestAnimationFrame(animBar);
    };
    rafBar=requestAnimationFrame(animBar);

    /* Typewriter for auth message */
    const typeTimer=setInterval(()=>{
      if(i<=AUTH_MSG.length){
        authText.textContent=AUTH_MSG.slice(0,i)+(i<AUTH_MSG.length?'â–Œ':'');
        i++;
      } else {
        clearInterval(typeTimer);
        /* Show Access Granted */
        setTimeout(()=>{
          authText.textContent='Identity Verified âœ“';
          authText.style.color='rgba(110,231,183,0.9)';
          setTimeout(()=>{
            if(accessEl)accessEl.classList.add('show');
            setTimeout(()=>{
              if(!dismissed){
                dismissed=true;
                loader.classList.add('hide');
                setTimeout(()=>{if(loader.parentNode)loader.parentNode.removeChild(loader);},1000);
              }
            },900);
          },300);
        },200);
      }
    },38);

    return()=>{
      clearInterval(typeTimer);
      if(rafBar)cancelAnimationFrame(rafBar);
    };
  },[]);
  return null;
}

function ClassifiedReveal({children,label='CLASSIFIED'}){
  const ref=useRef(null);
  const [unlocked,setUnlocked]=useState(false);
  const [sweeping,setSweeping]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting&&!unlocked){
        setSweeping(true);
        setTimeout(()=>setUnlocked(true),700);
        obs.disconnect();

    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[unlocked]);
  return(
    <div ref={ref} style={{position:'relative',overflow:'hidden'}}>
      {children}

        <div style={

  ],
  help: ['Available commands:','  whoami          — about me','  skills --list   — tech proficiency','  projects --count — project stats','  clear           — clear terminal'],
  clear: ['__CLEAR__'],
};

const AUTOSEQ = ['whoami','skills --list','projects --count'];

function Terminal(){
  const [lines, setLines] = useState([]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const [autoIdx, setAutoIdx] = useState(0);
  const [autoDone, setAutoDone] = useState(false);
  const [cmdBuf, setCmdBuf] = useState('');
  const ref = useRef(null);
  const bodyRef = useRef(null);
  const triggered = useRef(false);

  const pushLines = useCallback((cmd, output) => {
    if(output[0]==='__CLEAR__'){setLines([]);return;}
    setLines(prev=>[...prev,{type:'cmd',text:`$ ${cmd}`},...output.map(t=>({type:'out',text:t}))]);
  },[]);

  const typeCmd = useCallback((cmd, onDone)=>{
    setTyping(true); setCmdBuf('');
    let i=0;
    const t=setInterval(()=>{
      setCmdBuf(cmd.slice(0,i+1)); i++;
      if(i>=cmd.length){clearInterval(t);setTimeout(()=>{setTyping(false);setCmdBuf('');const out=COMMANDS[cmd]||[`command not found: ${cmd}`];pushLines(cmd,out);onDone&&onDone();},400);}
    },60);
    return()=>clearInterval(t);
  },[pushLines]);

  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting&&!triggered.current){triggered.current=true;obs.disconnect();
        setTimeout(()=>typeCmd(AUTOSEQ[0],()=>{setAutoIdx(1);}),600);
      }
    },{threshold:0.3});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[typeCmd]);

  useEffect(()=>{
    if(autoIdx===0||autoDone)return;
    if(autoIdx>=AUTOSEQ.length){setAutoDone(true);return;}
    const t=setTimeout(()=>typeCmd(AUTOSEQ[autoIdx],()=>setAutoIdx(i=>i+1)),800);
    return()=>clearTimeout(t);
  },[autoIdx,autoDone,typeCmd]);

  useEffect(()=>{if(bodyRef.current)bodyRef.current.scrollTop=bodyRef.current.scrollHeight;},[lines,cmdBuf]);

  const handleKey=e=>{
    if(e.key==='Enter'&&input.trim()){
      const cmd=input.trim().toLowerCase();
      setInput('');
      const out=COMMANDS[cmd]||[`command not found: ${cmd}`,'type "help" for available commands'];
      pushLines(cmd,out);
    }
  };

  return(
    <section id="terminal" style={{position:'relative',background:'#000',padding:'80px 5rem'}}>
      <ScrollReveal delay={0.1}>
        <p style={{fontSize:'0.8rem',fontFamily:'Barlow,sans-serif',color:'rgba(255,255,255,0.6)',marginBottom:16}}>// Interactive Terminal</p>
      </ScrollReveal>
      <ScrollReveal delay={0.2}>
        <h2 style={{fontFamily:'"Instrument Serif",serif',fontStyle:'italic',color:'#fff',fontSize:'clamp(2.5rem,6vw,5rem)',lineHeight:0.9,letterSpacing:'-3px',marginBottom:40}}>root@rishi:~$</h2>
      </ScrollReveal>
      <ScrollReveal delay={0.3}>
        <div ref={ref} className="terminal-window" style={{maxWidth:760}}>
          <div className="terminal-header">
            <div className="terminal-dot" style={{background:'#ff5f57'}}/>
            <div className="terminal-dot" style={{background:'#febc2e'}}/>
            <div className="terminal-dot" style={{background:'#28c840'}}/>
            <span style={{marginLeft:8,fontSize:'0.75rem',color:'rgba(255,255,255,0.4)',fontFamily:'JetBrains Mono,monospace'}}>rishi@portfolio ~ bash</span>
          </div>
          <div ref={bodyRef} className="terminal-body" style={{maxHeight:360,overflowY:'auto'}}>
            <div style={{marginBottom:12,color:'rgba(255,255,255,0.5)',fontSize:'0.8rem'}}>Welcome to Rishi's terminal. Commands auto-run, or type your own.</div>
            {lines.map((l,i)=>(
              <div key={i} style={{color:l.type==='cmd'?'#6ee7b7':'rgba(255,255,255,0.75)'}}>{l.text}</div>
            ))}
            {typing&&<div className="t-green">{`$ ${cmdBuf}`}<span className="cursor-blink"/></div>}
            {!typing&&(
              <div style={{display:'flex',alignItems:'center',gap:4,marginTop:4}}>
                <span className="t-green">$</span>
                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey}
                  placeholder="type a command..." autoComplete="off" spellCheck="false"
                  style={{background:'transparent',border:'none',outline:'none',color:'rgba(255,255,255,0.9)',fontFamily:'JetBrains Mono,monospace',fontSize:'13px',flex:1,caretColor:'#6ee7b7',cursor:'none'}}/>
                <span className="cursor-blink"/>
              </div>
            )}
          </div>
        </div>
      </ScrollReveal>
    </section>
  );
}

/* â”€â”€ DevTools / Inspect Element Detector â”€â”€ */
(function(){
  var devOpen = false;
  var threshold = 160;
  var SHIELD_ID = 'devtools-shield';
  var TOAST_ID  = 'devtools-toast';

  function showShield(){
    if(document.getElementById(SHIELD_ID)) return;
    var shield = document.createElement('div');
    shield.id = SHIELD_ID;
    shield.style.cssText = 'position:fixed;inset:0;z-index:98000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;transition:opacity 0.35s ease';
    var corners = {tl:'top:32px;left:32px;border-width:1px 0 0 1px',tr:'top:32px;right:32px;border-width:1px 1px 0 0',bl:'bottom:32px;left:32px;border-width:0 0 1px 1px',br:'bottom:32px;right:32px;border-width:0 1px 1px 0'};
    Object.keys(corners).forEach(function(k){
      var c=document.createElement('div');
      c.style.cssText='position:absolute;width:24px;height:24px;border-color:rgba(255,255,255,0.25);border-style:solid;'+corners[k];
      shield.appendChild(c);
    });
    var icon=document.createElement('div');
    icon.textContent='ðŸ‘€';
    icon.style.cssText='font-size:3rem';
    shield.appendChild(icon);
    var heading=document.createElement('div');
    heading.textContent='Access Restricted.';
    heading.style.cssText='font-family:"Instrument Serif",serif;font-style:italic;font-size:2.4rem;color:#fff;letter-spacing:-1px';
    shield.appendChild(heading);
    var sub=document.createElement('div');
    sub.style.cssText='font-family:"JetBrains Mono",monospace;font-size:0.78rem;color:rgba(255,255,255,0.45);letter-spacing:0.06em;text-align:center;line-height:1.8';
    sub.innerHTML='Close DevTools to continue.<br>Built by <span style="color:#6ee7b7">Rishi Sharma</span> &mdash; i.rishisharma2007@gmail.com';
    shield.appendChild(sub);
    var status=document.createElement('div');
    status.style.cssText='font-family:"JetBrains Mono",monospace;font-size:0.6rem;color:rgba(255,255,255,0.18);letter-spacing:0.2em;margin-top:8px';
    status.textContent='[ SECURITY PROTOCOL ACTIVE ]';
    shield.appendChild(status);
    document.body.appendChild(shield);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ shield.style.opacity='1'; }); });
  }

  function hideShield(){
    var shield=document.getElementById(SHIELD_ID);
    if(!shield)return;
    shield.style.opacity='0';
    setTimeout(function(){ if(shield.parentNode)shield.parentNode.removeChild(shield); },400);
  }

  function showToast(){
    if(document.getElementById(TOAST_ID))return;
    var toast=document.createElement('div');
    toast.id=TOAST_ID;
    toast.innerHTML='<span style="font-size:1.1rem">ðŸ‘€</span> <span>Caught you inspecting â€” <strong style="color:#6ee7b7">close DevTools</strong> to continue.</span>';
    toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(10,10,10,0.97);border:1px solid rgba(110,231,183,0.35);color:rgba(255,255,255,0.9);padding:12px 24px;border-radius:9999px;font-family:JetBrains Mono,monospace;font-size:0.78rem;z-index:99999;display:flex;align-items:center;gap:10px;letter-spacing:0.02em;box-shadow:0 0 30px rgba(110,231,183,0.2);transition:opacity 0.4s ease,transform 0.4s ease;opacity:0';
    document.body.appendChild(toast);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ toast.style.opacity='1';toast.style.transform='translateX(-50%) translateY(0)'; }); });
  }

  function removeToast(){
    var toast=document.getElementById(TOAST_ID);
    if(!toast)return;
    toast.style.opacity='0';
    toast.style.transform='translateX(-50%) translateY(20px)';
    setTimeout(function(){ if(toast.parentNode)toast.parentNode.removeChild(toast); },500);
  }

  function onDevOpen(){ showShield(); showToast(); }
  function onDevClose(){ hideShield(); removeToast(); devOpen=false; }

  /* Method 1: window size delta (Chrome/Edge) */
  function checkSize(){
    var isOpen=(window.outerWidth-window.innerWidth>threshold)||(window.outerHeight-window.innerHeight>threshold);
    if(isOpen&&!devOpen){ devOpen=true; onDevOpen(); }
    else if(!isOpen&&devOpen){ onDevClose(); }
  }
  window.addEventListener('resize',checkSize);
  setInterval(checkSize,800);

  /* Method 2: toString trick (Firefox/Safari) */
  var el=new Image();
  Object.defineProperty(el,'id',{get:function(){ if(!devOpen){devOpen=true;onDevOpen();} }});
  setInterval(function(){ console.log(el); console.clear(); },1500);
})();
