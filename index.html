<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#000;font-family:'Barlow',sans-serif;color:#fff;overflow-x:hidden}
@media(hover:hover){body{cursor:none}}

.liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.liquid-glass-strong{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);border:none;box-shadow:4px 4px 4px rgba(0,0,0,0.05),inset 0 1px 1px rgba(255,255,255,0.15);position:relative;overflow:hidden}
.liquid-glass-strong::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.2) 80%,rgba(255,255,255,0.5) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

.cursor-dot{position:fixed;width:8px;height:8px;background:#fff;border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference}
.cursor-ring{position:fixed;width:40px;height:40px;border:1.5px solid rgba(255,255,255,0.4);border-radius:50%;pointer-events:none;z-index:9998;transition:width 0.3s,height 0.3s,border-color 0.3s}
@media(hover:none){.cursor-dot,.cursor-ring{display:none!important}}

#loader{position:fixed;inset:0;background:#000;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease}
#loader.hide{opacity:0;pointer-events:none}
#loader-scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.015) 0px,rgba(255,255,255,0.015) 1px,transparent 1px,transparent 4px);pointer-events:none;animation:scanmove 8s linear infinite}
@keyframes scanmove{0%{background-position:0 0}100%{background-position:0 100px}}
#loader-corner-tl,#loader-corner-tr,#loader-corner-bl,#loader-corner-br{position:absolute;width:24px;height:24px;border-color:rgba(255,255,255,0.35);border-style:solid;}
#loader-corner-tl{top:32px;left:32px;border-width:1px 0 0 1px}
#loader-corner-tr{top:32px;right:32px;border-width:1px 1px 0 0}
#loader-corner-bl{bottom:32px;left:32px;border-width:0 0 1px 1px}
#loader-corner-br{bottom:32px;right:32px;border-width:0 1px 1px 0}
.auth-label{font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.25em;color:rgba(255,255,255,0.3);margin-bottom:48px;text-transform:uppercase}
#auth-text{font-family:'JetBrains Mono',monospace;font-size:0.9rem;letter-spacing:0.12em;color:rgba(255,255,255,0.7);min-height:1.5em;text-align:center}
#access-granted{font-family:'Instrument Serif',serif;font-style:italic;font-size:2.8rem;color:#fff;opacity:0;transform:scale(0.92);transition:opacity 0.6s ease,transform 0.6s ease;margin-top:16px;letter-spacing:-1px}
#access-granted.show{opacity:1;transform:scale(1)}
.auth-bar{width:240px;height:1px;background:rgba(255,255,255,0.08);margin-top:36px;overflow:hidden}
.auth-bar-fill{height:100%;background:rgba(255,255,255,0.5);width:0;transition:width 0.05s linear}

.terminal-window{background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.1);border-radius:12px;font-family:'JetBrains Mono',monospace;overflow:hidden}
.terminal-header{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.terminal-dot{width:10px;height:10px;border-radius:50%}
.terminal-body{padding:20px;min-height:300px;font-size:13px;line-height:1.8;color:rgba(255,255,255,0.9)}
.t-green{color:#6ee7b7}
.t-cyan{color:#67e8f9}
.t-dim{color:rgba(255,255,255,0.5)}
.cursor-blink{display:inline-block;width:8px;height:16px;background:#6ee7b7;animation:blink 1s step-end infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.tl-line{position:absolute;left:24px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.15),transparent)}
.tl-dot{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 15px rgba(255,255,255,0.3);flex-shrink:0}

#particles-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.4}

.video-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.2) 40%,rgba(0,0,0,0.3) 70%,rgba(0,0,0,0.7) 100%);pointer-events:none}
@keyframes pulse-dot{0%,100%{opacity:0.6;box-shadow:0 0 4px #6ee7b7}50%{opacity:1;box-shadow:0 0 12px #6ee7b7}}
@keyframes sweep-reveal{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
</style>
</head>
<body>
<div id="loader">
  <div id="loader-scanlines"></div>
  <div id="loader-corner-tl"></div><div id="loader-corner-tr"></div>
  <div id="loader-corner-bl"></div><div id="loader-corner-br"></div>
  <div class="auth-label">Portfolio OS v2.6.0 — Initializing</div>
  <div id="auth-text"></div>
  <div id="access-granted">Access Granted.</div>
  <div class="auth-bar"><div class="auth-bar-fill" id="auth-bar-fill"></div></div>
</div>
<canvas id="particles-canvas"></canvas>
<div id="root"></div>
<script type="text/babel" src="core.js"></script>

<script>

console.log('%c👀 Caught inspecting!', 'font-size:22px;font-weight:bold;color:#6ee7b7;font-family:monospace');
console.log('%cNice try. Built by Rishi Sharma — BCA student turning caffeine into code.', 'color:rgba(255,255,255,0.75);font-family:monospace;font-size:13px;line-height:1.6');
console.log('%c📬 i.rishisharma2007@gmail.com  |  📸 @_rishi_sharma28', 'color:rgba(255,255,255,0.45);font-size:11px;font-family:monospace');
console.log('%c────────────────────────────────────', 'color:rgba(255,255,255,0.15);font-family:monospace');
console.log('%c  Want to hire me? That\'s the right instinct.', 'color:#6ee7b7;font-family:monospace;font-size:12px');

/* ── DevTools / Inspect Element Detector ── */
(function(){
  var devOpen = false;
  var threshold = 160;
  var SHIELD_ID = 'devtools-shield';
  var TOAST_ID  = 'devtools-toast';

  function showShield(){
    if(document.getElementById(SHIELD_ID)) return;
    var shield = document.createElement('div');
    shield.id = SHIELD_ID;
    shield.style.cssText = 'position:fixed;inset:0;z-index:98000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;transition:opacity 0.35s ease';
    var corners = {tl:'top:32px;left:32px;border-width:1px 0 0 1px',tr:'top:32px;right:32px;border-width:1px 1px 0 0',bl:'bottom:32px;left:32px;border-width:0 0 1px 1px',br:'bottom:32px;right:32px;border-width:0 1px 1px 0'};
    Object.keys(corners).forEach(function(k){
      var c=document.createElement('div');
      c.style.cssText='position:absolute;width:24px;height:24px;border-color:rgba(255,255,255,0.25);border-style:solid;'+corners[k];
      shield.appendChild(c);
    });
    var icon=document.createElement('div');
    icon.textContent='👀';
    icon.style.cssText='font-size:3rem';
    shield.appendChild(icon);
    var heading=document.createElement('div');
    heading.textContent='Access Restricted.';
    heading.style.cssText='font-family:"Instrument Serif",serif;font-style:italic;font-size:2.4rem;color:#fff;letter-spacing:-1px';
    shield.appendChild(heading);
    var sub=document.createElement('div');
    sub.style.cssText='font-family:"JetBrains Mono",monospace;font-size:0.78rem;color:rgba(255,255,255,0.45);letter-spacing:0.06em;text-align:center;line-height:1.8';
    sub.innerHTML='Close DevTools to continue.<br>Built by <span style="color:#6ee7b7">Rishi Sharma</span> &mdash; i.rishisharma2007@gmail.com';
    shield.appendChild(sub);
    var status=document.createElement('div');
    status.style.cssText='font-family:"JetBrains Mono",monospace;font-size:0.6rem;color:rgba(255,255,255,0.18);letter-spacing:0.2em;margin-top:8px';
    status.textContent='[ SECURITY PROTOCOL ACTIVE ]';
    shield.appendChild(status);
    document.body.appendChild(shield);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ shield.style.opacity='1'; }); });
  }

  function hideShield(){
    var shield=document.getElementById(SHIELD_ID);
    if(!shield)return;
    shield.style.opacity='0';
    setTimeout(function(){ if(shield.parentNode)shield.parentNode.removeChild(shield); },400);
  }

  function showToast(){
    if(document.getElementById(TOAST_ID))return;
    var toast=document.createElement('div');
    toast.id=TOAST_ID;
    toast.innerHTML='<span style="font-size:1.1rem">👀</span> <span>Caught you inspecting — <strong style="color:#6ee7b7">close DevTools</strong> to continue.</span>';
    toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(10,10,10,0.97);border:1px solid rgba(110,231,183,0.35);color:rgba(255,255,255,0.9);padding:12px 24px;border-radius:9999px;font-family:JetBrains Mono,monospace;font-size:0.78rem;z-index:99999;display:flex;align-items:center;gap:10px;letter-spacing:0.02em;box-shadow:0 0 30px rgba(110,231,183,0.2);transition:opacity 0.4s ease,transform 0.4s ease;opacity:0';
    document.body.appendChild(toast);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ toast.style.opacity='1';toast.style.transform='translateX(-50%) translateY(0)'; }); });
  }

  function removeToast(){
    var toast=document.getElementById(TOAST_ID);
    if(!toast)return;
    toast.style.opacity='0';
    toast.style.transform='translateX(-50%) translateY(20px)';
    setTimeout(function(){ if(toast.parentNode)toast.parentNode.removeChild(toast); },500);
  }

  function onDevOpen(){ showShield(); showToast(); }
  function onDevClose(){ hideShield(); removeToast(); devOpen=false; }

  /* Method 1: window size delta (Chrome/Edge) */
  function checkSize(){
    var isOpen=(window.outerWidth-window.innerWidth>threshold)||(window.outerHeight-window.innerHeight>threshold);
    if(isOpen&&!devOpen){ devOpen=true; onDevOpen(); }
    else if(!isOpen&&devOpen){ onDevClose(); }
  }
  window.addEventListener('resize',checkSize);
  setInterval(checkSize,800);

  /* Method 2: toString trick (Firefox/Safari) */
  var el=new Image();
  Object.defineProperty(el,'id',{get:function(){ if(!devOpen){devOpen=true;onDevOpen();} }});
  setInterval(function(){ console.log(el); console.clear(); },1500);
})();
</script>
</body>
